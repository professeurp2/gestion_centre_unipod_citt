{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}UNIPOD Mali{% endblock %}</title>
  <style>
    :root { --bleu:#0468b1; --bleu-fonce:#03487a; --fond:#f4f6f9; --texte:#1f2933; --gris:#6b7785; --ok:#1b8a4b; --alerte:#c0392b; --orange:#d97706; --carte:#fff; --bord:#e1e6ec; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--fond); color:var(--texte); }
    header { background:var(--bleu); color:#fff; padding:12px 24px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between; }
    header a { color:#fff; text-decoration:none; margin-left:16px; font-size:.95rem; }
    header strong { font-size:1.1rem; }
    main { max-width:1280px; margin:0 auto; padding:24px 16px; }
    h1 { font-size:1.4rem; margin:0 0 16px; }
    h2 { font-size:1.05rem; margin:24px 0 12px; color:var(--bleu-fonce); border-bottom:2px solid var(--bord); padding-bottom:6px; }
    .filtres { display:flex; flex-wrap:wrap; gap:12px; align-items:end; background:var(--carte); padding:12px 16px; border:1px solid var(--bord); border-radius:8px; }
    .filtres label { display:flex; flex-direction:column; font-size:.8rem; color:var(--gris); gap:4px; }
    .filtres input, .filtres select, .bouton { padding:6px 10px; border:1px solid var(--bord); border-radius:6px; font:inherit; }
    .bouton { background:var(--bleu); color:#fff; border:none; cursor:pointer; text-decoration:none; display:inline-block; }
    .bouton.secondaire { background:#fff; color:var(--bleu); border:1px solid var(--bleu); }
    .grille { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
    .kpi { background:var(--carte); border:1px solid var(--bord); border-radius:8px; padding:14px 16px; }
    .kpi .libelle { font-size:.8rem; color:var(--gris); min-height:2.2em; }
    .kpi .valeur { font-size:1.6rem; font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums; }
    .kpi .valeur small { font-size:.8rem; font-weight:400; color:var(--gris); }
    .kpi .detail { font-size:.78rem; color:var(--gris); margin-top:4px; }
    .barre { height:6px; background:var(--bord); border-radius:3px; margin-top:6px; overflow:hidden; }
    .barre span { display:block; height:100%; background:var(--ok); }
    .alertes { display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:12px; }
    .panneau { background:var(--carte); border:1px solid var(--bord); border-radius:8px; padding:12px 16px; }
    .panneau h3 { margin:0 0 8px; font-size:.95rem; display:flex; justify-content:space-between; }
    .panneau ul { list-style:none; padding:0; margin:0; font-size:.88rem; }
    .panneau li { padding:5px 0; border-top:1px solid var(--bord); display:flex; justify-content:space-between; gap:8px; }
    .panneau li:first-child { border-top:none; }
    .badge { font-size:.75rem; padding:1px 8px; border-radius:10px; background:var(--bord); white-space:nowrap; }
    .badge.rouge { background:#fde2e0; color:var(--alerte); } .badge.orange { background:#fef3c7; color:var(--orange); }
    .vide { color:var(--gris); font-style:italic; font-size:.85rem; }
    a { color:var(--bleu); }
    @media (max-width:500px){ .alertes{grid-template-columns:1fr;} header a{margin-left:0;margin-right:12px;} }
  </style>
</head>
<body>
<header>
  <strong>UNIPOD Mali — Gestion du centre</strong>
  <nav>
    <a href="{% url 'tableau-de-bord' %}">Tableau de bord</a>
    <a href="{% url 'admin:index' %}">Gestion</a>
    <a href="/api/">API</a>
    {% if user.is_authenticated %}<a href="{% url 'admin:logout' %}" onclick="event.preventDefault();document.getElementById('deco').submit();">Déconnexion ({{ user }})</a>
    <form id="deco" method="post" action="{% url 'admin:logout' %}" hidden>{% csrf_token %}</form>{% endif %}
  </nav>
</header>
<main>{% block contenu %}{% endblock %}</main>
</body>
</html>
